[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]


  topics = [
    "iot/blemesh/node/+/metrics/#",
    "iot/power/#"
  ]

  data_format = "json"


  tag_keys = ["node_addr"]


  topic_tag = "topic"

# --- 2. SALIDA: INFLUXDB ---
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "sensores"
